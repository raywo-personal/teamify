<div class="app-layout">
  <aside class="sidebar"
         tabindex="-1"
         id="navSidebar"
         role="region"
         aria-labelledby="sidebarLabel">
    <hgroup class="sidebar-header brand">
      <i class="bi-people-fill brand-logo"></i>
      <div class="text-logo" id="sidebarLabel">
        <h2 class="sidebar-title">Teamify</h2>
        <small class="">Where Talent Meets Timing</small>
      </div>
    </hgroup>

    <nav class="sidebar-body" app-navigation></nav>

    <footer class="sidebar-footer" >
      <div class="made-by">
        <ng-container i18n="@@t.madeByMessage">Made by raywo with</ng-container>&nbsp;<i class="bi-heart-fill text-danger"></i>&nbsp;|&nbsp;
        <i class="bi-github"></i>&nbsp;
        <a href="https://github.com/raywo-personal/teamify" target="_blank">
          Source code
        </a>
      </div>

      <nav class="legal-links">
        <a href="https://www.skillbird.de/datenschutz/"
           target="_blank"
           ngbTooltip="Privacy policy"
           i18n-ngbTooltip="@@t.privacyPolicy">
          <i class="bi-shield-lock"></i>
          <span class="legal-title" i18n="@@t.privacyPolicy">Privacy policy</span>
        </a>
        <a href="https://www.skillbird.de/impressum/"
           target="_blank"
           ngbTooltip="Imprint"
           i18n-ngbTooltip="@@t.imprint">
          <i class="bi-info-circle"></i>
          <span class="legal-title" i18n="@@t.imprint">Imprint</span>
        </a>
      </nav>
    </footer>
  </aside>


  <div class="main">
    <header class="top-bar" app-top-bar></header>
    <main>
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
