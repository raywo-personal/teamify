name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm and Node.js
        uses: pnpm/setup@v3
        # No `version` or `runtime`: the action reads `packageManager` and
        # `devEngines.runtime` from package.json, so CI and a local
        # `pnpm install` run the same versions.
        with:
          cache: true
          install: false

      - run: pnpm install --frozen-lockfile

      - run: pnpm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.SKILLBIRD_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.SKILLBIRD_CLOUDFLARE_ACCOUNT_ID }}
